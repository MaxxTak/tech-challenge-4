services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-voc-api
    env_file:
      - path: .env
        required: false
    environment:
      DATA_RAW_DIR: /app/data/raw
      DATA_PROCESSED_DIR: /app/data/processed
      RESULTS_DIR: /app/results
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - hf_cache:/root/.cache/huggingface
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-voc-ui
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
      RAG_API_KEY: ${RAG_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    command:
      [
        "streamlit",
        "run",
        "src/ui/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ingest"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_RAW_DIR: /app/data/raw
      DATA_PROCESSED_DIR: /app/data/processed
      RESULTS_DIR: /app/results
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - hf_cache:/root/.cache/huggingface
    command: ["python", "-m", "src.ingestion.pipeline", "--raw-dir", "data/raw", "--rebuild"]

volumes:
  hf_cache:
