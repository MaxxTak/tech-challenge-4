[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-voc-rag"
version = "1.0.0"
description = "Voice of Customer Intelligence com RAG sobre o dataset Olist (Zero-DB / Parquet)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4,<2.0",
    "langchain-core>=1.6,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langchain-google-genai>=4.4,<5.0",
    "langchain-openai>=1.6,<2.0",
    "langchain-chroma>=1.1,<2.0",
    "chromadb>=0.6",
    "langgraph>=1.2,<2.0",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "numpy>=2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.49.0",
    "streamlit>=1.40",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
